[package]
name = "verticopolis-engine-bench"
version = "0.0.0"
edition = "2021"
rust-version = "1.97"
publish = false
description = "The weekly hour-boundary cost bench of the Verticopolis engine: report-only timings, never a gate"

# Its own workspace root, like consumer/, and outside the crate's include
# list: what the crate packages is part of the engine source hash, and a
# bench is not a simulation input.
[workspace]

[dependencies]
verticopolis-engine = { path = ".." }

[profile.release]
debug = 1
# Match the engine crate's release profile, so a bench times what ships.
codegen-units = 1
