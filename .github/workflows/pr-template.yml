name: PR template

# A pull request description keeps the sections of
# .github/PULL_REQUEST_TEMPLATE.md. The check and its rules are shared by every
# Verticopolis repository and live in Verticopolis/.github
# (.github/workflows/pr-template.yml and checks/prTemplate.ts). Editing the
# description runs it again, so fixing the body turns the check green without
# a push.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

concurrency:
  group: pr-template-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  description:
    uses: Verticopolis/.github/.github/workflows/pr-template.yml@main
