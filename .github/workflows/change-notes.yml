name: Change notes

# Checks the change notes under .changes/ (.changes/README.md): every note
# parses, and a pull request that changes what the crate ships adds one with
# its crate tier. Cut release turns the notes into the changelog section.
#
# It installs nothing: scripts/change-notes-check.ts uses only Node's own
# modules and git.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Change notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Check the notes
        # GITHUB_HEAD_REF and GITHUB_BASE_REF are set by Actions on a pull request.
        run: node scripts/change-notes-check.ts --base "origin/$GITHUB_BASE_REF"
