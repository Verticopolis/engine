name: Engine packages

# Builds the engine's WASM packages and packs the three tarballs a game pins
# (scripts/pack-engine.sh): @verticopolis/engine (the player build),
# @verticopolis/engine-tooling (with the tier 3 ops test suites and harnesses
# use) and @verticopolis/engine-conformance (conformance/). It also runs the
# packer's own TypeScript tests.
#
# - A pull request or a push to main uploads the tarballs as a run artifact.
#   A PR's tarballs are versioned <crate>-pr.<number>.<run> so a game PR can
#   try them without mistaking them for a release.
# - A pushed engine-v<version> tag attaches them, with their checksums, to
#   that tag's GitHub release, creating the release when it does not exist.
#   The tag must name the crate version in engine-rs/Cargo.toml. Nothing here
#   publishes to npm or crates.io (engine-publish.yml does, on its own).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["engine-v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pack:
    name: Pack the engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test the packer
        run: |
          npm run typecheck
          npm test

      - name: Engine WASM package
        uses: ./.github/actions/engine-wasm

      - name: Version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          crate=$(awk '/^\[package\]/ { p = 1; next } /^\[/ { p = 0 } p && /^version *=/ { gsub(/.*= *"|".*/, ""); print; exit }' engine-rs/Cargo.toml)
          case "$REF" in
            refs/tags/engine-v*)
              tag="${REF#refs/tags/}"
              if [ "$tag" != "engine-v$crate" ]; then
                echo "::error::Tag $tag does not match the crate version $crate in engine-rs/Cargo.toml."
                exit 1
              fi
              version="$crate"
              ;;
            *)
              if [ "$EVENT" = pull_request ]; then version="$crate-pr.$PR.$RUN"; else version="$crate-main.$RUN"; fi
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh scripts/pack-engine.sh "$VERSION" dist

      - name: Upload the tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-packages-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to the release
    needs: pack
    if: startsWith(github.ref, 'refs/tags/engine-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: engine-packages-*
          path: dist
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # No --clobber: a game pins these tarballs by hash, so a re-run that
          # finds them attached fails instead of replacing them.
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Engine ${TAG#engine-v}" \
              --notes "The engine's packages for ${TAG#engine-v}: the player build, the tooling build and the conformance suite, each with its SHA-256 checksum. See https://docs.verticopolis.com/javascript/ for how to load them."
          fi
          gh release upload "$TAG" dist/*
