name: Engine packages

# Builds the engine's WASM packages and packs the tarball a game pins
# (scripts/pack-engine.sh): @verticopolis/engine, the player build with the
# tooling build (tooling/, with the tier 3 ops test suites and harnesses use)
# and the conformance suite (conformance/) as subpaths. It also runs the
# packer's own TypeScript tests, ESLint and the Prettier check, and installs
# the tarball into an empty project and uses it there
# (scripts/package-consumer.sh). The TypeScript layer under
# packages/verticopolis-engine/src is typechecked and tested against the
# fresh build, and compiled into the tarball.
#
# - A pull request or a push to main uploads the tarball as a run artifact.
#   A PR's tarball is versioned <crate>-pr.<number>.<run> so a game PR can
#   try them without mistaking them for a release.
#
# Releases come from release-tag.yml alone, which packs the same tarballs
# for the release it creates; nothing here creates a release or publishes to
# npm or crates.io.
#
# A pull request that changes only prose (.github/actions/docs-only lists
# it) still runs the job, so the required check reports, but every step
# after Scope skips and no tarball is uploaded. A new step here needs the
# same `if`.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pack:
    name: Pack the engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its base, for the scope step below.
          fetch-depth: 2
          persist-credentials: false

      - name: Scope
        id: scope
        uses: ./.github/actions/docs-only

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Typecheck, lint, format check and test the packer
        if: steps.scope.outputs.run == 'true'
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test

      - name: Engine WASM package
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/engine-wasm

      # The TypeScript layer (packages/verticopolis-engine/src) is typechecked
      # against the binding the build just wrote, and its fixtures must match
      # the engine's own answers.
      - name: Typecheck and test the TypeScript layer
        if: steps.scope.outputs.run == 'true'
        run: |
          npm run layer:typecheck
          npm run layer:test
          node scripts/layer-fixtures.ts --check

      - name: Version
        if: steps.scope.outputs.run == 'true'
        id: version
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          crate=$(awk '/^\[package\]/ { p = 1; next } /^\[/ { p = 0 } p && /^version *=/ { gsub(/.*= *"|".*/, ""); print; exit }' engine-rs/Cargo.toml)
          if [ "$EVENT" = pull_request ]; then version="$crate-pr.$PR.$RUN"; else version="$crate-main.$RUN"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        if: steps.scope.outputs.run == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh scripts/pack-engine.sh "$VERSION" dist

      # Install the tarball into an empty project and use it there, so a
      # file the package needs but does not carry fails before a release.
      - name: Use the packed tarball as a game would
        if: steps.scope.outputs.run == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh scripts/package-consumer.sh "dist/verticopolis-engine-$VERSION.tgz"

      - name: Upload the tarballs
        if: steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-packages-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
