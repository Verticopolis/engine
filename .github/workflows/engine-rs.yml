name: Rust engine

# The engine lives in engine-rs/. Its referee is the conformance suite
# (conformance/): the engine must reproduce every pinned checkpoint, so this
# job runs it on every change to the crate, the scenarios or the lock, and on
# main. Format and lint run as hard
# gates, like the TypeScript lane.

# A pull request that touches none of the engine's inputs (the list is in
# .github/actions/rust-scope/action.yml) still runs every job below, so the
# required engine-rs check reports, but each job's steps after the Scope step
# skip and it finishes in seconds. Every new step in these jobs needs the
# same `if: steps.scope.outputs.run == 'true'`, or it runs on such a pull
# request with nothing built.

concurrency:
  # Cancel superseded PR runs; preserve main pushes for cache warming.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    container:
      # rust:1.97.0-bookworm, the toolchain the engine pins (rust-version).
      image: rust:1.97.0-bookworm@sha256:8fa55b2f3ddf97471ab6a767bfa3f37e6bad0986ba823e75fea57e2a2a5c3073
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its base, for the scope step below.
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Cargo.toml
            /Cargo.lock
            /.cargo/
            /engine-rs/
            /conformance/
            /.github/actions/rust-scope/

      - name: Scope
        id: scope
        uses: ./.github/actions/rust-scope

      # Besides the scope action, which holds no code the build reads.
      - name: Only the engine and the conformance suite are checked out
        if: steps.scope.outputs.run == 'true'
        run: |
          top="$(ls -A | grep -vx '.git' | LC_ALL=C sort | tr '\n' ' ')"
          if [ "$top" != ".cargo .github Cargo.lock Cargo.toml conformance engine-rs " ]; then
            echo "the checkout holds: $top"; exit 1
          fi
          github="$(find .github -type f)"
          if [ "$github" != ".github/actions/rust-scope/action.yml" ]; then
            echo ".github holds: $github"; exit 1
          fi
          test -f engine-rs/Cargo.toml
          test -f conformance/expected.json

      # The Actions runner mounts its own Node.js under /__e for JavaScript
      # actions such as checkout; it is not on PATH, and the image has none.
      - name: Node.js is unreachable
        if: steps.scope.outputs.run == 'true'
        run: |
          for n in node nodejs npm npx corepack yarn pnpm bun; do
            if command -v "$n"; then echo "$n is on PATH"; exit 1; fi
          done
          if find /usr /opt /bin /sbin /root /home -xdev \( -name node -o -name nodejs \) -type f 2>/dev/null | grep .; then
            echo "the image holds Node.js"; exit 1
          fi

      - name: Rust toolchain
        if: steps.scope.outputs.run == 'true'
        run: |
          rustup show active-toolchain | grep -q '^1\.97\.0'
          rustup component add rustfmt clippy

      # The cargo registry and the compiled dependencies, keyed on the
      # installed toolchains, each Cargo.lock and the job. Only a run on main
      # saves, so a pull request reads main's cache and never writes one of
      # its own. Old dependency builds are kept across lockfile bumps; bump
      # prefix-key to start the cache over when it grows.
      - name: Cargo cache
        if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          workspaces: |
            . -> engine-rs/target
            engine-rs/consumer -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Default features: no binding and no conformance harness, the
      # library a host that only plays the game links.
      - name: The engine library builds alone
        if: steps.scope.outputs.run == 'true'
        working-directory: engine-rs
        run: cargo build --locked --lib

      # The default/WASM tests, instrumented conformance tests and release
      # referee run in the rust job. Repeating them here duplicates minutes without
      # adding host-independence coverage: the external consumer below
      # exercises the engine from an actual standalone crate instead.

      # What crates.io would receive (Cargo.toml `include`), built from the
      # unpacked copy under target/package/, so a file the library needs
      # from outside the crate fails here instead of in the release. The
      # crate is copied out of the checkout first: this sparse checkout has
      # no blobs for the rest of the repository, which cargo's git status
      # check would read, and a copy with no repository around it proves
      # the same thing a registry download does.
      - name: The crate packages on its own
        if: steps.scope.outputs.run == 'true'
        run: |
          crate="$RUNNER_TEMP/crate"
          rm -rf "$crate"
          mkdir -p "$crate"
          tar -C engine-rs --exclude=./target --exclude=./pkg --exclude=./consumer -cf - . | tar -C "$crate" -xf -
          # The workspace's lock, which the packaged crate carries.
          cp Cargo.lock "$crate/Cargo.lock"
          cd "$crate"
          cargo package --locked
          version="$(cargo metadata --locked --no-deps --format-version 1 | grep -o '"version":"[^"]*"' | head -n 1 | cut -d'"' -f4)"
          test -d "target/package/verticopolis-engine-$version"
          echo "VC_PACKAGED=$crate/target/package/verticopolis-engine-$version" >> "$GITHUB_ENV"

      - name: The consumer, in place
        if: steps.scope.outputs.run == 'true'
        working-directory: engine-rs/consumer
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          # The JavaScript binding is a feature a native host never turns on,
          # and no browser crate or getrandom is in the tree. Normal and
          # build dependencies on every target count; the tree is captured
          # first so a cargo failure fails the step.
          tree="$(cargo tree --locked -e normal,build --target all --prefix none)"
          test -n "$tree"
          if grep -E '^(wasm-bindgen|js-sys|web-sys|getrandom) ' <<<"$tree"; then
            echo "a browser or host crate reached a native host's tree"; exit 1
          fi

      - name: The consumer, as a crate outside the checkout
        if: steps.scope.outputs.run == 'true'
        run: |
          host="$RUNNER_TEMP/host"
          mkdir -p "$host"
          cp -R engine-rs/consumer/Cargo.toml engine-rs/consumer/Cargo.lock engine-rs/consumer/src "$host/"
          # The packaged crate, as a host that downloads it from crates.io gets it.
          sed -i "s|^verticopolis-engine = { path = \"..\", |verticopolis-engine = { path = \"$VC_PACKAGED\", |" "$host/Cargo.toml"
          grep -qx "verticopolis-engine = { path = \"$VC_PACKAGED\", features = \[\"conformance\"\] }" "$host/Cargo.toml"
          # The suite under another name, as a packaged copy would be: a
          # fixture resolves inside whatever directory holds the suite.
          suite="$RUNNER_TEMP/suite-copy"
          rm -rf "$suite"
          cp -R conformance "$suite"
          cd "$host"
          VC_CONFORMANCE="$suite" cargo test --locked
          cargo run --locked --release -- "$suite"

      # A cancelled run can skip every step above and still leave the job
      # green, which would pass the required check unchecked. Fail instead.
      - name: Fail a cancelled run
        if: ${{ cancelled() }}
        run: exit 1

  # Format and the six clippy builds, beside the tests instead of before
  # them: together they took a minute or more at the head of the rust job,
  # which is the longest engine job now that coverage is faster.
  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its base, for the scope step below.
          fetch-depth: 2

      - name: Scope
        id: scope
        uses: ./.github/actions/rust-scope

      # ubuntu-latest ships a stable toolchain through rustup; pin the channel
      # the crate was written against rather than whatever the image happens
      # to carry. Every cargo step runs --locked so a stale Cargo.lock fails
      # the run instead of being rewritten on the runner.
      - name: Rust toolchain
        if: steps.scope.outputs.run == 'true'
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup default 1.97.0
          rustup target add wasm32-unknown-unknown
          # The image's own stable toolchain is unused here, and the cache
          # key hashes every installed toolchain, so an image update would
          # otherwise miss the cache on every pull request.
          rustup toolchain uninstall stable || true

      # The cargo registry and the compiled dependencies, keyed on the
      # installed toolchains, Cargo.lock and the job. Only a run on main
      # saves, so a pull request reads main's cache and never writes one of
      # its own. Bump prefix-key to start the cache over when it grows.
      - name: Cargo cache
        if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          workspaces: ". -> engine-rs/target"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        if: steps.scope.outputs.run == 'true'
        run: cargo fmt --check

      - name: Lint
        if: steps.scope.outputs.run == 'true'
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features conformance -- -D warnings
          cargo clippy --locked --all-targets --features wasm -- -D warnings
          cargo clippy --locked --all-targets --features tooling -- -D warnings
          cargo clippy --locked --lib --target wasm32-unknown-unknown --features wasm -- -D warnings
          cargo clippy --locked --lib --target wasm32-unknown-unknown --features tooling -- -D warnings

      # A cancelled run can skip every step above and still leave the job
      # green, which would pass the required check unchecked. Fail instead.
      - name: Fail a cancelled run
        if: ${{ cancelled() }}
        run: exit 1

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The test builds keep line tables only for debug info: a failing test's
    # backtrace keeps its files and lines, and each of the two test builds
    # compiles about 20% faster than with full debug info (80 s to 64 s on a
    # 4-core runner). Set for the whole job so the Cargo cache key, which
    # hashes CARGO_ variables, changes with it and main saves dependencies
    # built this way.
    env:
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    defaults:
      run:
        working-directory: engine-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its base, for the scope step below.
          fetch-depth: 2

      - name: Scope
        id: scope
        uses: ./.github/actions/rust-scope

      # ubuntu-latest ships a stable toolchain through rustup; pin the channel
      # the crate was written against rather than whatever the image happens
      # to carry. Every cargo step runs --locked so a stale Cargo.lock fails
      # the run instead of being rewritten on the runner.
      - name: Rust toolchain
        if: steps.scope.outputs.run == 'true'
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup default 1.97.0
          rustup target add wasm32-unknown-unknown
          # The image's own stable toolchain is unused here, and the cache
          # key hashes every installed toolchain, so an image update would
          # otherwise miss the cache on every pull request.
          rustup toolchain uninstall stable || true

      # The cargo registry and the compiled dependencies, keyed on the
      # installed toolchains, Cargo.lock and the job. Only a run on main
      # saves, so a pull request reads main's cache and never writes one of
      # its own. Bump prefix-key to start the cache over when it grows.
      - name: Cargo cache
        if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          workspaces: ". -> engine-rs/target"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Unit tests
        if: steps.scope.outputs.run == 'true'
        # Run native/default and WASM-feature variants. The tooling feature
        # (the binding's tier 3 ops, #1057) turns wasm on as well, so its run
        # covers every binding test the wasm feature alone would; the player
        # build without tier 3 is held by the clippy runs in the rust-lint
        # job. The conformance feature variant is exercised by cargo
        # llvm-cov's test run in the rust-coverage job; don't run those same
        # tests twice.
        # Keep debug assertions and overflow checks enabled.
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: "1"
        run: |
          cargo test --locked
          cargo test --locked --features tooling

      - name: Conformance
        if: steps.scope.outputs.run == 'true'
        run: cargo run --locked --release --features conformance --bin conformance

      # A cancelled run can skip every step above and still leave the job
      # green, which would pass the required check unchecked. Fail instead.
      - name: Fail a cancelled run
        if: ${{ cancelled() }}
        run: exit 1

  # The referee again, compiled to WebAssembly (wasm32-wasip1) and run under
  # Node's WASI, so the pinned checkpoints also hold for the engine built the
  # way a browser runs it. Scenarios replay one after another there (no
  # threads). The flag works around a Node crash in WASI's fast write path
  # (scripts/conformance-wasi.mts).
  #
  # The same job holds the seeded differential's corpus
  # (conformance/fuzz-corpus/): scenarios the nightly fuzz once diverged on,
  # shrunk by scripts/fuzz-shrink.mts, plus smoke entries so it never runs on
  # nothing. Each is replayed by the fuzzer built natively, which must
  # reproduce the entry's pinned golden (conformance/fuzz-corpus/goldens/), and
  # by the fuzzer built for wasm32-wasip1 under Node's WASI, which must agree
  # with the native run at every checkpoint (scripts/fuzz-corpus.mts, with a
  # 240 s budget of its own).
  wasm-referee:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its base, for the scope step below.
          fetch-depth: 2
          persist-credentials: false

      - name: Scope
        id: scope
        uses: ./.github/actions/rust-scope

      - name: Rust toolchain
        if: steps.scope.outputs.run == 'true'
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy
          rustup default 1.97.0
          rustup target add wasm32-wasip1
          rustup toolchain uninstall stable || true

      - name: Cargo cache
        if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-wasm-referee
          workspaces: ". -> engine-rs/target"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: ".nvmrc"

      - name: Lint the referee and the fuzzer for wasm32-wasip1
        if: steps.scope.outputs.run == 'true'
        working-directory: engine-rs
        run: cargo clippy --locked --features conformance --bin conformance --bin fuzz --target wasm32-wasip1 -- -D warnings

      - name: Build the referee for wasm32-wasip1
        if: steps.scope.outputs.run == 'true'
        working-directory: engine-rs
        run: cargo build --locked --release --features conformance --bin conformance --target wasm32-wasip1

      - name: Conformance under WASI
        if: steps.scope.outputs.run == 'true'
        run: node --no-turbo-fast-api-calls scripts/conformance-wasi.mts engine-rs/target/wasm32-wasip1/release/conformance.wasm conformance

      - name: Build the fuzzer natively and for wasm32-wasip1
        if: steps.scope.outputs.run == 'true'
        working-directory: engine-rs
        run: |
          cargo build --locked --release --features conformance --bin fuzz
          cargo build --locked --release --features conformance --bin fuzz --target wasm32-wasip1

      - name: Replay the fuzz corpus on both builds
        if: steps.scope.outputs.run == 'true'
        run: node scripts/fuzz-corpus.mts --budget 240

      - name: Fail a cancelled run
        if: ${{ cancelled() }}
        run: exit 1

  # Line coverage of the unit tests and the referee, split out of the rust
  # job so the two run side by side: coverage alone takes about 8 minutes,
  # and after the unit tests it made the rust job the longest PR check.
  rust-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The instrumented tests and the referee build at opt-level 1, as the
    # rust job's unit tests do: unoptimized, they took 8 to 10 minutes, the
    # longest check on an engine change. Debug assertions and overflow checks
    # stay on (they follow the profile, not the opt-level), and rustc places
    # the coverage counters before LLVM optimizes; the line floor below still
    # holds the measurement. Set for the whole job so the Cargo cache key,
    # which hashes CARGO_ variables, keeps these builds apart from the
    # unoptimized ones.
    # Debug info is line tables only, as in the rust job's unit tests: the
    # coverage counters do not use it, and the instrumented builds compile
    # faster without full debug info.
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        working-directory: engine-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its base, for the scope step below.
          fetch-depth: 2

      - name: Scope
        id: scope
        uses: ./.github/actions/rust-scope

      # ubuntu-latest ships a stable toolchain through rustup; pin the channel
      # the crate was written against rather than whatever the image happens
      # to carry. Every cargo step runs --locked so a stale Cargo.lock fails
      # the run instead of being rewritten on the runner.
      - name: Rust toolchain
        if: steps.scope.outputs.run == 'true'
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
          # The image's own stable toolchain is unused here, and the cache
          # key hashes every installed toolchain, so an image update would
          # otherwise miss the cache on every pull request.
          rustup toolchain uninstall stable || true

      # The cargo registry and the compiled dependencies, keyed on the
      # installed toolchains, Cargo.lock and the job. Only a run on main
      # saves, so a pull request reads main's cache and never writes one of
      # its own. Bump prefix-key to start the cache over when it grows.
      - name: Cargo cache
        if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          workspaces: ". -> engine-rs/target"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The prebuilt cargo-llvm-cov release, checked against the hash the
      # action's manifest records, in place of a compile from source. With
      # no fallback, a version the manifest lacks fails the step instead of
      # installing another way.
      - name: cargo-llvm-cov
        if: steps.scope.outputs.run == 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none

      # Coverage of the unit tests plus the referee, with a line floor that
      # only ratchets up as scenarios land (80.58% at the first measurement,
      # 84.47% after the first scenario slice, 88.7% with the full library; the
      # floor sits about a point and a half under the measurement).
      # The conformance-feature unit tests run here (not a second time
      # in the Unit tests step). The referee runs in the dev profile (at the
      # job's opt-level 1) here to merge coverage; the release replay in the
      # rust job is the parity gate.
      - name: Coverage
        if: steps.scope.outputs.run == 'true'
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov --version | grep -qw '0\.9\.1'
          cargo llvm-cov --no-report --locked test --features conformance
          cargo llvm-cov --no-report --locked run --features conformance --bin conformance
          cargo llvm-cov report --fail-under-lines 87

      - name: Fail a cancelled run
        if: ${{ cancelled() }}
        run: exit 1

  engine-rs:
    needs: [consumer, rust-lint, rust, wasm-referee, rust-coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every engine job passed
        env:
          CONSUMER: ${{ needs.consumer.result }}
          LINT: ${{ needs.rust-lint.result }}
          RUST: ${{ needs.rust.result }}
          WASM: ${{ needs.wasm-referee.result }}
          COVERAGE: ${{ needs.rust-coverage.result }}
        run: |
          echo "consumer: $CONSUMER, rust-lint: $LINT, rust: $RUST, wasm-referee: $WASM, rust-coverage: $COVERAGE"
          test "$CONSUMER" = success && test "$LINT" = success && test "$RUST" = success && test "$WASM" = success && test "$COVERAGE" = success

      - name: Fail a cancelled run
        if: ${{ cancelled() }}
        run: exit 1
