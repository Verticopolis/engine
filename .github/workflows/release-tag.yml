name: Release tags

# Publishes each engine version as a GitHub release when the pull request that
# raises it merges (CONTRIBUTING.md "Releasing"), so every crate version gets
# a release without a maintainer pushing a tag. A push to main that changes
# the crate version in engine-rs/Cargo.toml tags v<version> on that commit
# and publishes the release, named after the tag and marked Latest, with that
# version's engine-rs/CHANGELOG.md section. Versions up to 1.57.2 were tagged
# engine-v<version>; their releases are left alone. The release carries the
# three tarballs scripts/pack-engine.sh packs (the player build, the tooling
# build and the conformance suite), each with its checksum. When the
# repository variable ENGINE_REGISTRY_PUBLISH is `on`, the run then
# dispatches engine-publish.yml, which waits for the owner's approval and
# publishes the crate to crates.io and the player tarball to npm as
# @verticopolis/engine (CONTRIBUTING.md "The registries").
#
# This is the only workflow that creates a release. It packs the release
# itself; engine-pack.yml packs the same tarballs only as run artifacts.
# A tag or release that already exists is left alone, so a re-run is safe. To
# finish a version whose run failed, run this workflow by hand from main with
# that version: it must be the version engine-rs/Cargo.toml holds.
on:
  push:
    branches: [main]
    paths: ["engine-rs/Cargo.toml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Engine version to release (x.y.z, the one engine-rs/Cargo.toml holds on main)"
        required: true
        type: string

permissions:
  contents: read

# No concurrency group on purpose: GitHub keeps one pending run per group, so a
# later push to main could replace a queued release merge's run, and that run
# would never be tagged. Each run acts only on its own push's version change and
# skips a tag or release that exists, so two runs at once cannot collide.

jobs:
  tag:
    # A run by hand releases what main holds, never a branch's unmerged code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the crate version before and after the push
        id: versions
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.version }}
        run: |
          read_crate() { awk '/^\[package\]/ { p = 1; next } /^\[/ { p = 0 } p && /^version *=/ { gsub(/.*= *"|".*/, ""); print; exit }'; }
          crate="$(read_crate < engine-rs/Cargo.toml)"
          echo "crate=$crate" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$REQUESTED" != "$crate" ]; then
              echo "::error::engine-rs/Cargo.toml on this commit holds $crate, not $REQUESTED."
              exit 1
            fi
            echo "Releasing $crate by hand."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A new branch or a force-push has no usable "before"; tag nothing then.
          if ! printf '%s' "$BEFORE" | grep -Eq '^[0-9a-f]{40}$' || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git fetch --no-tags --quiet --depth=1 origin "$BEFORE"; then
            echo "No previous main commit to compare with; tagging nothing."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          was="$(git show "$BEFORE:engine-rs/Cargo.toml" | read_crate)"
          if [ "$was" = "$crate" ]; then
            echo "The crate stays at $crate; tagging nothing."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "The crate moved from $was to $crate."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The crate release carries the built WASM package. These steps run only
      # for a crate version change, and the package usually comes from the
      # cache the test runs already filled for this engine source.
      - name: Use Node.js (from .nvmrc)
        if: ${{ steps.versions.outputs.changed == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        if: ${{ steps.versions.outputs.changed == 'true' }}
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Engine WASM package
        if: ${{ steps.versions.outputs.changed == 'true' }}
        uses: ./.github/actions/engine-wasm

      # scripts/pack-engine.sh packs the release's three tarballs, each with a
      # checksum, the same way engine-pack.yml does on every pull request:
      # @verticopolis/engine (the player build, which engine-publish.yml
      # publishes to npm, so the bytes on npm are the ones here),
      # @verticopolis/engine-tooling and @verticopolis/engine-conformance. A
      # tag this workflow creates with its own token starts no tag-push
      # workflow, so it packs here rather than leaving it to engine-pack.yml.
      - name: Pack the engine
        id: pack
        if: ${{ steps.versions.outputs.changed == 'true' }}
        env:
          VERSION: ${{ steps.versions.outputs.crate }}
        run: |
          set -eu
          sh scripts/pack-engine.sh "$VERSION" dist
          tgz="verticopolis-engine-$VERSION.tgz"
          test -f "dist/$tgz"
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          echo "npm=@verticopolis/engine" >> "$GITHUB_OUTPUT"

      - name: Tag the crate version and publish its release
        if: ${{ steps.pack.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.versions.outputs.crate }}
          TGZ: ${{ steps.pack.outputs.tgz }}
          NPM_NAME: ${{ steps.pack.outputs.npm }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if [ "$(gh release view "engine-v$VERSION" --json isDraft --jq .isDraft 2>/dev/null || true)" = false ]; then
            echo "$VERSION was released as engine-v$VERSION; leaving it."
            exit 0
          fi
          # A published release is left alone; a draft from a failed run is redone.
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then echo "$tag already has a release; leaving it."; exit 0; fi
            gh release delete "$tag" --yes
          fi
          # The version's section of the engine changelog, heading excluded.
          awk -v v="$VERSION" '/^## / { if (on) exit; if ($2 == v) { on = 1; next } } on' engine-rs/CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "::error::engine-rs/CHANGELOG.md has no $VERSION section."; exit 1; fi
          {
            printf '\nThe crate is [`verticopolis-engine` %s](https://crates.io/crates/verticopolis-engine/%s) on crates.io, or `verticopolis-engine = { git = "https://github.com/%s", tag = "%s" }` through git.\n' "$VERSION" "$VERSION" "$GH_REPO" "$tag"
            printf '\n`%s` holds the player build (`node/` for Node, `web/` for the browser, `events/` for the gameplay event types). The tooling build and the conformance suite are beside it, each tarball with its SHA-256 checksum. The player build is [`%s@%s`](https://www.npmjs.com/package/%s/v/%s) on npm, published from `%s`.\n' "$TGZ" "$NPM_NAME" "$VERSION" "$NPM_NAME" "$VERSION" "$TGZ"
            printf '\nThe registry copies appear once the owner approves the publish run (`engine-publish.yml`).\n'
          } >> notes.md
          # Attach while a draft, then publish, so a published release is never edited.
          # This repository releases only the engine, so its newest release is Latest.
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md --latest --draft
          gh release upload "$tag" dist/*
          gh release edit "$tag" --draft=false --latest
          echo "Published $tag with $(ls dist | tr '\n' ' ')"

      # The registries: engine-publish.yml publishes the crate to crates.io
      # and the release's npm tarball to npm, each through trusted publishing
      # (a short-lived OIDC token, no stored registry token). Its publish jobs
      # wait on the `registry` environment, so nothing reaches a registry
      # until the owner approves that run. A run for a version a registry
      # already holds leaves that registry alone, so a re-run is safe.
      # The step runs only when the repository variable
      # ENGINE_REGISTRY_PUBLISH is `on` (the owner's switch, on since the
      # first publish of 1.57.1), so turning it off ships GitHub releases
      # without touching a registry.
      - name: Hand the crate release to the registry publish
        if: ${{ steps.pack.outcome == 'success' && vars.ENGINE_REGISTRY_PUBLISH == 'on' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.versions.outputs.crate }}
        run: |
          set -euo pipefail
          gh workflow run engine-publish.yml --ref main -f version="$VERSION"
          echo "Dispatched the registry publish for $VERSION; it waits for approval in the registry environment."

      - name: Note that the registry publish is off
        if: ${{ steps.pack.outcome == 'success' && vars.ENGINE_REGISTRY_PUBLISH != 'on' }}
        env:
          VERSION: ${{ steps.versions.outputs.crate }}
        run: echo "::notice::Registry publishing is off (repository variable ENGINE_REGISTRY_PUBLISH is not 'on'), so $VERSION was not handed to engine-publish.yml."
