name: Rust engine scope
description: >-
  Decide whether a Rust engine job has work to do. A pull request that
  touches none of the engine's inputs (below) answers run=false, so the jobs
  in engine-rs.yml skip their steps and finish green in seconds instead of
  holding a runner for minutes; the required engine-rs check still reports.
  A push to main, a merge group, a manual run, or any doubt (the diff cannot
  be read, or it lists no files) answers run=true. Needs a checkout with
  fetch-depth 2, so the pull request's merge commit has its base parent.

outputs:
  run:
    description: "'true' when the job must run its steps, 'false' when it may skip them."
    value: ${{ steps.scope.outputs.run }}

runs:
  using: composite
  steps:
    - id: scope
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
      run: |
        # A file can skip the Rust jobs only if it is on the "elsewhere" list
        # (docs, change notes, the npm package's TypeScript, repo tooling,
        # other workflows) and not on the "inputs" list. Anything else,
        # including a file nobody listed yet, runs them, so the list fails
        # safe when the layout changes. The crate's code may read nothing
        # outside the crate but the conformance suite
        # (engine-rs/tests/read_boundary.rs), and TypeScript files are never
        # Rust inputs.
        elsewhere='^(docs/|\.changes/|history/|packages/|tools/|engine-bench/|scripts/|\.github/|src/(build|wasmhost|events)/.*\.(ts|mts)$|(README|CONTRIBUTING|API|CHANGELOG|AGENTS|CLAUDE)\.md$|engine-rs/(README|API|CHANGELOG)\.md$|LICENSE$|\.gitignore$|\.git-blame-ignore-revs$|package(-lock)?\.json$|tsconfig[^/]*\.json$|\.prettier[^/]*$|eslint\.config\.[^/]+$)'
        inputs='^(scripts/conformance-wasi\.mts$|scripts/fuzz|\.github/workflows/engine-rs\.yml$|\.github/actions/rust-scope/)'
        run=true
        if [ "$EVENT" = pull_request ]; then
          # A pull request checks out its merge commit; its first parent is
          # the base it merges into, so this is exactly what the PR changes.
          if changed="$(git diff --name-only --no-renames HEAD^1 HEAD)" && [ -n "$changed" ]; then
            echo "Changed files:"; echo "$changed"
            if ! grep -vE "$elsewhere" <<<"$changed" >/dev/null && ! grep -qE "$inputs" <<<"$changed"; then
              run=false
            fi
          else
            echo "::warning::the pull request's diff could not be read; running every step"
          fi
        fi
        echo "run=$run"
        echo "run=$run" >> "$GITHUB_OUTPUT"
