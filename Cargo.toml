# The repository root is a Cargo workspace whose one member is the engine
# crate, verticopolis-engine (engine-rs/). The consumer crate and the bench
# keep their own workspaces, so each resolves the engine the way a project
# outside this repository would.
[workspace]
resolver = "2"
members = ["engine-rs"]
exclude = ["engine-rs/consumer", "engine-bench"]

# Profiles live on the workspace root; Cargo ignores them in a member.
[profile.release]
debug = 1
# One codegen unit: the player .wasm is about 470 KB (15%) smaller and a
# game day up to 3% faster in WASM than at the default 16, and timing no
# longer shifts when rustc splits the crate differently after an unrelated
# change (perf audit, 2026-11-17; owner chose it for the slower build).
codegen-units = 1
